---
layout: default
---
<header class="page-header">
  {% if page.date %}
  <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %d, %Y' }}</time></p>
  {% endif %}
  <h1>{{ page.heading | default: page.title | escape }}</h1>
  {% if page.intro %}<p class="intro">{{ page.intro | escape }}</p>{% endif %}
</header>
<div class="page-content">{{ content }}</div>
