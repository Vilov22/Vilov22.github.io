<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="shell">
      <header class="site-header">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
        <nav aria-label="Main navigation">
          {% assign links = 'Home|/,Projects|/projects/,Posts|/posts/,CV|/cv/' | split: ',' %}
          {% for item in links %}
            {% assign parts = item | split: '|' %}
            <a href="{{ parts[1] | relative_url }}"{% if page.url == parts[1] %} aria-current="page"{% endif %}>{{ parts[0] }}</a>
          {% endfor %}
        </nav>
      </header>
      <main id="content">{{ content }}</main>
      <footer class="site-footer">
        <span>{{ site.title | escape }}</span>
        <span>A small corner of the universe.</span>
      </footer>
    </div>
  </body>
</html>
